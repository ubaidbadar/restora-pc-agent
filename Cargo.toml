[package]
name = "restora-pc-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Restora Print: prints Restora slips on the printers connected to a Windows PC"
repository = "https://github.com/ubaidbadar/restora-pc-agent"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.21", default-features = false }
winreg = "0.55"

[build-dependencies]
winresource = "0.1"
