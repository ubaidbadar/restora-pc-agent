name: Publish MSIX to release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download MSIX artifact from run 43630819838
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43630819838 --repo ubaidbadar/restora-pc-agent --name RestoraAgent-0.1.20.0-msix --dir msix
          ls -l msix
      - name: Upload MSIX to release v0.1.20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.20 msix/RestoraAgent-0.1.20.0.msix --repo ubaidbadar/restora-pc-agent --clobber
