name: Publish MSIX to release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download MSIX artifact from run 42579029015
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42579029015 --name RestoraAgent-0.1.12.0-msix --dir msix
          ls -l msix
      - name: Upload MSIX to release v0.1.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.14 msix/RestoraAgent-0.1.12.0.msix --clobber
