name: Experiment - format WPP upgrade
on:
  push:
    branches: [exp/printer-wpp-bindings]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/printer-wpp-bindings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source and commit
        run: |
          cargo fmt --all
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format WPP experimental Rust changes"
          git push origin HEAD:exp/printer-wpp-bindings
