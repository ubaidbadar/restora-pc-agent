name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The same Windows release gate maintainers run locally: formatting,
      # clippy, unit/integration tests (including DPAPI), then release build.
      - name: Verify Windows release candidate
        shell: pwsh
        run: ./scripts/verify-local.ps1 -Release
      - name: Verify signed-PWA provisioning script fails closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $issues = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/provision-pwa.ps1').Path,
            [ref]$tokens, [ref]$issues) | Out-Null
          if ($issues.Count -gt 0) { throw "Invalid PowerShell syntax: $issues" }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -File scripts/provision-pwa.ps1 `
            -PackagePath "$env:RUNNER_TEMP\\missing.msix" `
            -ExpectedSha256 ('0' * 64) `
            -PackageName BadarDigital.RestoraTest `
            -ExpectedPublisher CN=Test `
            -ApplicationId App
          if ($LASTEXITCODE -eq 0) { throw 'Missing signed PWA was incorrectly accepted' }
      - name: Smoke test built agent and loopback security on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Start-Process -FilePath './target/release/restora-pc-agent.exe' -ArgumentList '--background' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              if ($agent.HasExited) { throw 'Restora Agent exited before localhost was ready' }
              try {
                $status = Invoke-WebRequest 'http://127.0.0.1:17777/status' -TimeoutSec 2
                if ($status.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Restora Agent loopback endpoint never became healthy' }
            $blocked = Invoke-WebRequest 'http://127.0.0.1:17777/print' -Method POST -Body '{}' -ContentType 'application/json' -SkipHttpErrorCheck
            if ($blocked.StatusCode -ne 403) { throw "Originless write should be forbidden, got HTTP $($blocked.StatusCode)" }
          } finally {
            Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test parent-bound embedded engine (no standalone installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Restora Agent'
          $engine = Start-Process -FilePath './target/release/restora-pc-agent.exe' -ArgumentList @('--embedded', '--parent-pid', "$PID") -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($engine.HasExited) { throw 'Embedded engine exited unexpectedly' }
              try {
                $status = Invoke-WebRequest 'http://127.0.0.1:17777/status' -TimeoutSec 2
                if ($status.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Embedded engine did not expose local status' }
            $forbidden = Invoke-WebRequest 'http://127.0.0.1:17777/print' -Method POST -Body '{}' -ContentType 'application/json' -SkipHttpErrorCheck
            if ($forbidden.StatusCode -ne 403) { throw "Originless print was not forbidden: $($forbidden.StatusCode)" }
            $after = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Restora Agent'
            if ($before -ne $after) { throw 'Embedded engine changed standalone autostart registry entry' }
          } finally {
            Stop-Process -Id $engine.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test headless engine with no auto-start changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).RestoraPrintAgent
          $engine = Start-Process -FilePath './target/release/restora-pc-agent.exe' -ArgumentList @('--headless', '--background') -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              if ($engine.HasExited) { throw 'Headless print engine exited before becoming ready' }
              try {
                $status = Invoke-WebRequest 'http://127.0.0.1:17777/status' -TimeoutSec 2
                if ($status.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Headless print engine did not become healthy' }
            $after = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).RestoraPrintAgent
            if ($before -ne $after) { throw 'Headless mode changed standalone startup settings' }
          } finally {
            Stop-Process -Id $engine.Id -Force -ErrorAction SilentlyContinue
          }
      # The exe of every push and pull request, under the run's Artifacts (kept 30 days). Releases are made by tagging.
      - uses: actions/upload-artifact@v4
        with:
          name: restora-pc-agent-windows
          path: target/release/restora-pc-agent.exe
          retention-days: 30
