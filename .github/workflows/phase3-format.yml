name: Temporary formatting for printer integration tests
on:
  push:
    branches: [feat/printer-status-phase3]
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/printer-status-phase3
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust and commit formatting if necessary
        run: |
          cargo fmt --all
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: rustfmt fault-injection suite"
          git push origin HEAD:feat/printer-status-phase3
