<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restora Print</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' width='40' height='40'><rect width='40' height='40' rx='10' fill='%234F46E5'/><g fill='%23FFFFFF'><circle cx='20' cy='9.5' r='2.5'/><path d='M9 23a11 11 0 0 1 22 0z'/><rect x='7' y='25' width='26' height='4' rx='2'/><path d='M10.5 28h5L10 32.5z'/></g></svg>">
<style>
  /* Restora's colors (restora-web src/index.css): primary indigo, ink text, white cards on a light page. */
  :root { --primary: #4F46E5; --primary-hover: #4338CA; --primary-soft: #EEF2FF; --ink: #0F172A; --muted: #475569; --page: #F8FAFC; --surface: #FFFFFF; --line: #E2E8F0; --danger: #A3301F; --success: #1F6B43; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem 1rem; background: var(--page); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: 100%; max-width: 26rem; background: var(--surface); border-radius: 1rem; box-shadow: 0 1px 2px rgb(15 23 42 / .06), 0 8px 24px rgb(15 23 42 / .06); padding: 2rem 1.5rem; text-align: center; }
  .logo { width: 3.5rem; height: 3.5rem; }
  h1 { font-size: 1.5rem; font-weight: 650; margin: .75rem 0 .25rem; }
  p { color: var(--muted); margin: .5rem 0; }
  input { font: inherit; font-size: 1.75rem; letter-spacing: .4em; width: 100%; padding: .6rem; margin-top: 1rem; text-align: center; color: var(--ink); border: 1px solid var(--line); border-radius: .75rem; outline: none; }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  button { font: inherit; font-weight: 600; margin-top: .75rem; padding: .75rem 1rem; width: 100%; cursor: pointer; color: #fff; background: var(--primary); border: 0; border-radius: .75rem; }
  button:hover { background: var(--primary-hover); }
  #state { font-weight: 600; }
  #state.ok { color: var(--success); }
  #state.wait { color: var(--danger); }
  #message { min-height: 1.5em; }
  .error { color: var(--danger) !important; }
</style>
<main>
<svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40"><rect width="40" height="40" rx="10" fill="#4F46E5"/><g fill="#FFFFFF"><circle cx="20" cy="9.5" r="2.5"/><path d="M9 23a11 11 0 0 1 22 0z"/><rect x="7" y="25" width="26" height="4" rx="2"/><path d="M10.5 28h5L10 32.5z"/></g></svg>
<h1>Restora Print</h1>
<div id="paired" hidden>
  <p id="state"></p>
  <p>Printers are set up in Restora under Settings, then Printers. You can close this page; Restora Print keeps running by the clock.</p>
</div>
<form id="form" hidden>
  <p>In Restora, open Settings, then Printers, then add this PC. Type the 6-digit code it shows.</p>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" autofocus placeholder="000000" aria-label="Pairing code">
  <button>Connect this PC</button>
</form>
<p id="message"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const code = $('code');
  let busy = false;

  // Asks the agent every few seconds, so the page follows along: paired, back online, or removed in Restora.
  async function refresh() {
    try {
      const status = await (await fetch('/status')).json();
      $('paired').hidden = !status.paired;
      $('form').hidden = status.paired;
      $('state').className = status.online ? 'ok' : 'wait';
      $('state').textContent = status.online ? 'Connected to Restora. Ready to print.' : 'Waiting for internet. Slips print here when it is back.';
      if (!status.paired && !busy) code.focus();
    } catch {
      $('message').className = 'error';
      $('message').textContent = 'Restora Print is not running. Open it again from the Start menu or desktop.';
    }
  }

  async function pair() {
    if (busy || code.value.length !== 6) return;
    busy = true;
    $('message').className = '';
    $('message').textContent = 'Connecting…';
    try {
      const response = await fetch('/setup/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code.value }) });
      const answer = await response.json();
      if (!response.ok) throw new Error(answer.message);
      $('message').textContent = '';
      await refresh();
    } catch (error) {
      $('message').className = 'error';
      $('message').textContent = error.message || 'Could not connect. Check the internet and try again.';
      code.select();
    } finally {
      busy = false;
    }
  }

  // Digits only, and the 6th digit connects by itself: no button to find.
  code.oninput = () => {
    code.value = code.value.replace(/\D/g, '').slice(0, 6);
    pair();
  };
  $('form').onsubmit = (event) => {
    event.preventDefault();
    pair();
  };
  refresh();
  setInterval(refresh, 3000);
</script>
</html>
